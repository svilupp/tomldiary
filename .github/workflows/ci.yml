name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Fail if the committed uv.lock is out of sync with pyproject.toml, and keep
    # every `uv run` below pinned to the locked versions (no silent re-resolution).
    env:
      UV_FROZEN: "1"
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --frozen
    
    - name: Lint with ruff
      run: |
        uv run ruff check src tests
        uv run ruff format --check src tests
    
    - name: Type check with mypy
      run: |
        uv run mypy src/tomldiary --ignore-missing-imports
    
    - name: Run tests
      run: |
        uv run pytest -v --cov=tomldiary --cov-report=xml tests
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build
    
    - name: Build package
      run: python -m build
    
    - name: Check dist contents
      run: |
        ls -la dist/
        pip install twine
        twine check dist/*